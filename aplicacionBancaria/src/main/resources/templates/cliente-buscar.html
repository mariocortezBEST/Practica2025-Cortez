<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h2 class="text-center">Buscar Cliente por DNI</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/clientes/buscar}" method="post" class="mb-4">
                    <div class="row g-3 align-items-center">
                        <div class="col-auto">
                            <label for="dni" class="col-form-label">DNI:</label>
                        </div>
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="dni" name="dni" required>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-primary">Buscar</button>
                        </div>
                    </div>
                </form>
                
                <!-- Resultado de la búsqueda -->
                <div th:if="${encontrado} != null">
                    <!-- Si se encontró el cliente -->
                    <div th:if="${encontrado}" class="mt-4">
                        <h3 class="mb-3">Datos del Cliente</h3>
                        <div class="card">
                            <div class="card-body">
                                <p><strong>ID:</strong> <span th:text="${cliente.id}"></span></p>
                                <p><strong>DNI:</strong> <span th:text="${cliente.dni}"></span></p>
                                <p><strong>Nombre:</strong> <span th:text="${cliente.nombre}"></span></p>
                                <p><strong>Usuario:</strong> <span th:text="${cliente.nombreUsuario}"></span></p>
                                <p><strong>Correo:</strong> <span th:text="${cliente.correoElectronico}"></span></p>
                                <p><strong>Domicilio:</strong> <span th:text="${cliente.domicilio}"></span></p>
                                <p><strong>Estado:</strong> 
                                    <span th:if="${cliente.estado}" class="badge bg-success">Habilitado</span>
                                    <span th:unless="${cliente.estado}" class="badge bg-danger">Inhabilitado</span>
                                </p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Si no se encontró el cliente -->
                    <div th:unless="${encontrado}" class="alert alert-warning" role="alert">
                        <span th:text="${mensaje}"></span>
                    </div>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                    <a th:href="@{/clientes/}" class="btn btn-secondary">Volver</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
