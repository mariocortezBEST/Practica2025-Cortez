<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h2 class="text-center">Lista de Clientes</h2>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(clientes)}" class="alert alert-info">
                    No hay clientes registrados.
                </div>
                
                <div th:if="${not #lists.isEmpty(clientes)}">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>DNI</th>
                                <th>Nombre</th>
                                <th>Usuario</th>
                                <th>Correo</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="cliente : ${clientes}">
                                <td th:text="${cliente.id}"></td>
                                <td th:text="${cliente.dni}"></td>
                                <td th:text="${cliente.nombre}"></td>
                                <td th:text="${cliente.nombreUsuario}"></td>
                                <td th:text="${cliente.correoElectronico}"></td>
                                <td>
                                    <span th:if="${cliente.estado}" class="badge bg-success">Habilitado</span>
                                    <span th:unless="${cliente.estado}" class="badge bg-danger">Inhabilitado</span>
                                </td>
                                <td>
                                    <a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}" 
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('¿Está seguro de eliminar este cliente?')">
                                        Eliminar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                    <a th:href="@{/clientes/nuevo}" class="btn btn-primary me-md-2">Nuevo Cliente</a>
                    <a th:href="@{/clientes/}" class="btn btn-secondary">Volver</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
