<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema Bancario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h1 class="text-center">Sistema de Gestión Bancaria</h1>
            </div>
            <div class="card-body">
                <div class="text-center mb-4">
                    <h2>Bienvenido al Sistema</h2>
                    <p>Por favor, seleccione una opción:</p>
                </div>
                <div class="row justify-content-center">
                    <div class="col-md-8">
                        <div class="d-grid gap-3">
                            <a th:href="@{/clientes/nuevo}" class="btn btn-primary btn-lg">Registrar Nuevo Cliente</a>
                            <a th:href="@{/clientes/lista}" class="btn btn-success btn-lg">Ver Lista de Clientes</a>
                            <a th:href="@{/clientes/buscar}" class="btn btn-info btn-lg text-white">Buscar Cliente por DNI</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-footer text-center">
                <p>Práctica Spring Boot 2025</p>
            </div>
        </div>
    </div>
</body>
</html>
